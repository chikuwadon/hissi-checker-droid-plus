// Produce the Maven dependency graph from Gradle's *selected* resolution results,
// rather than parsing requested versions from AGP publication metadata.
// Run via: gradle -I tools/resolved-dependency-snapshot.gradle exportResolvedDependencySnapshot
import groovy.json.JsonOutput
import org.gradle.api.artifacts.DependencyResolutionListener
import org.gradle.api.artifacts.ResolvableDependencies
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedComponentResult
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Capture every configuration that is actually resolved while compiling,
// running unit tests and Lint, including AGP's detached tool configurations.
// This listener is intended for this isolated CI job (configuration cache OFF).
def buildResolutions = Collections.synchronizedList([])
gradle.addListener(new DependencyResolutionListener() {
  void beforeResolve(ResolvableDependencies dependencies) { }
  void afterResolve(ResolvableDependencies dependencies) {
    buildResolutions.add([dependencies.path, dependencies.resolutionResult.rootComponent.get()])
  }
})

gradle.projectsEvaluated {
  def root = gradle.rootProject

  root.tasks.register('exportResolvedDependencySnapshot') {
    group = 'verification'
    description = 'Generate a GitHub dependency snapshot from actually selected Gradle modules'

    doLast {
      def resolved = new LinkedHashMap<String, Map>()
      def scanned = []
      def configurationsToScan = [[root.path, 'buildscript.classpath', root.buildscript.configurations.classpath]]

      root.allprojects.each { project ->
        if (project == root) return
        // Include build scripts and all resolvable application/test classpaths.
        configurationsToScan << [project.path, 'buildscript.classpath', project.buildscript.configurations.classpath]
        project.configurations.each { configuration ->
          if (configuration.canBeResolved && (
              configuration.name.endsWith('RuntimeClasspath') ||
              configuration.name.endsWith('CompileClasspath'))) {
            configurationsToScan << [project.path, configuration.name, configuration]
          }
        }
      }

      def coordinate = { component ->
        def id = component.id
        id instanceof ModuleComponentIdentifier ? "${id.group}:${id.module}:${id.version}" : null
      }
      def addNode = { String key, boolean direct ->
        if (key == null) return
        if (!resolved.containsKey(key)) {
          def pieces = key.split(':', 3)
          resolved[key] = [
            package_url: "pkg:maven/${pieces[0]}/${pieces[1]}@${pieces[2]}",
            relationship: direct ? 'direct' : 'indirect',
            dependencies: []
          ]
        } else if (direct) {
          resolved[key].relationship = 'direct'
        }
      }

      // Every resolved configuration observed during the actual build is
      // included in the submitted graph, not just AGP project classpaths.
      new ArrayList(buildResolutions).each { event ->
        configurationsToScan << [':resolved', event[0], event[1]]
      }
      configurationsToScan.each { entry ->
        def projectPath = entry[0]
        def configName = entry[1]
        def configuration = entry[2]
        def rootComponent = configuration instanceof ResolvedComponentResult ? configuration : configuration.incoming.resolutionResult.rootComponent.get()
        def seen = new HashSet<String>()
        def queue = new ArrayDeque()
        queue.add(rootComponent)
        int count = 0

        while (!queue.isEmpty()) {
          def component = queue.removeFirst()
          def componentKey = component.id.displayName
          if (!seen.add(componentKey)) continue

          def parentCoord = coordinate(component)
          if (parentCoord != null) addNode(parentCoord, false)
          component.dependencies.each { dependency ->
            if (dependency instanceof UnresolvedDependencyResult) {
              throw new GradleException("Unresolved dependency in ${projectPath}:${configName}: ${dependency.attempted}")
            }
            if (!(dependency instanceof ResolvedDependencyResult)) return
            def child = dependency.selected
            def childCoord = coordinate(child)
            if (childCoord != null) {
              addNode(childCoord, component == rootComponent)
              if (parentCoord != null && !resolved[parentCoord].dependencies.contains(childCoord)) {
                resolved[parentCoord].dependencies << childCoord
              }
            }
            queue.add(child)
          }
          count++
        }
        println "Resolved dependency graph: ${projectPath}:${configName}, components=${count}"
        scanned << "${projectPath}:${configName}"
      }

      if (!resolved.containsKey('com.android.tools.build:gradle:9.5.1')) {
        throw new GradleException('AGP 9.5.1 is missing from the submitted buildscript graph')
      }
      if (!resolved.containsKey('org.jsoup:jsoup:1.24.1')) {
        throw new GradleException('App jsoup dependency is missing from the submitted graph')
      }
      resolved.each { k, v -> v.dependencies.sort() }
      def sorted = new TreeMap<String, Map>(resolved)
      def sha = System.getenv('GITHUB_SHA') ?: '0000000000000000000000000000000000000000'
      def ref = System.getenv('GITHUB_REF') ?: 'refs/heads/local'
      def runId = System.getenv('GITHUB_RUN_ID') ?: 'local'
      def snapshot = [
        version: 0,
        sha: sha,
        ref: ref,
        job: [
          id: runId,
          correlator: 'hissi-verified-gradle-resolution'
        ],
        detector: [
          name: 'Gradle selected resolution graph',
          version: '1.0.0',
          url: 'https://github.com/chikuwadon/hissi-checker-droid-plus'
        ],
        scanned: new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
        manifests: [
          'settings.gradle': [
            name: 'settings.gradle',
            file: [source_location: 'settings.gradle'],
            resolved: sorted
          ]
        ]
      ]

      def output = root.file(root.findProperty('resolvedSnapshotOutput') ?: 'build/reports/dependencies/resolved-snapshot.json')
      output.parentFile.mkdirs()
      output.text = JsonOutput.prettyPrint(JsonOutput.toJson(snapshot)) + '\n'
      println "Generated selected Gradle snapshot: ${resolved.size()} module versions, ${scanned.size()} configurations, file=${output}"
    }
  }
}
