name: Validate signed release candidate (private)
on:
  push:
    branches:
      - 'release-candidate/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore persistent signing key (fail closed)
        env:
          KEY_B64: ${{ secrets.HISSI_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.HISSI_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing fixed signing secrets; refusing unsigned candidate."
            exit 1
          fi
          keyfile="$RUNNER_TEMP/hissi-signing.p12"
          printf '%s' "$KEY_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          keytool -list -keystore "$keyfile" -storetype PKCS12 -storepass "$KEY_PASSWORD" -alias hissi-checker-droid > /dev/null
          echo "HISSI_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
      - name: Run unit tests, release Lint and signed Release build
        env:
          HISSI_KEYSTORE_PASSWORD: ${{ secrets.HISSI_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify release package, debuggable flag, licenses and signer
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/release-badging.txt"
          grep -Fq "package: name='com.chikuwadon.hissidroidplus' versionCode='23' versionName='1.0.0'" "$RUNNER_TEMP/release-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/release-badging.txt"; then
            echo "::error::Release candidate must not be debuggable."
            exit 1
          fi
          unzip -Z1 "$apk" | grep -Fxq 'assets/third_party_licenses.txt'
          unzip -Z1 "$apk" | grep -Fxq 'assets/offline_boards.tsv'
          unzip -p "$apk" assets/offline_boards.tsv | sha256sum | grep -Fq 'c28ceeeb53b73808c20adce61ec1db1d51dc6355b3222a5b2e8f252ef5bdb423'
          if unzip -Z1 "$apk" | grep -Fxq 'assets/original_boards.tsv'; then
            echo "::error::Legacy board asset must not be bundled."
            exit 1
          fi
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signing-check.txt"
          expected="C908661AC6522B031D8E1FBC6E04194B774788F37161E4B979D941C4A80B7C2C"
          actual="$(grep -i 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signing-check.txt" | head -1 | sed 's/.*: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Signing certificate is not the fixed QA signing identity."
            exit 1
          fi
          sha256sum "$apk"
          echo "Package, version, release flags, license and signing identity verified."
      - name: Build signed v0.1.21 predecessor from pinned source
        env:
          HISSI_KEYSTORE_PASSWORD: ${{ secrets.HISSI_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/hissi-v021" 2084be7388396fd91db9dec46da021e86ff5d701
          gradle --no-daemon -p "$RUNNER_TEMP/hissi-v021" :app:assembleRelease
          mkdir -p baseline
          cp "$RUNNER_TEMP/hissi-v021/app/build/outputs/apk/release/app-release.apk" baseline/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging baseline/app-release.apk | grep -Fq "versionCode='22' versionName='0.1.21'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose baseline/app-release.apk
      - name: Save private upgrade predecessor APK
        uses: actions/upload-artifact@v4
        with:
          name: HissiCheckerDroidPlus-v0.1.21-private-upgrade-baseline
          path: baseline/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Save release lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HissiCheckerDroidPlus-release-lint
          path: app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 7
      - name: Save private signed candidate (not a GitHub Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HissiCheckerDroidPlus-v1.0.0-signed-release-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator-upgrade:
    needs: signed-release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HissiCheckerDroidPlus-v1.0.0-signed-release-candidate
          path: candidate
      - name: Download signed predecessor from this run
        uses: actions/download-artifact@v4
        with:
          name: HissiCheckerDroidPlus-v0.1.21-private-upgrade-baseline
          path: baseline
      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify fresh install and signed upgrade on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_smoke.sh
      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-api-${{ matrix.api-level }}
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 7

  private-clean-source-export:
    needs: signed-release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build allowlisted public source preview (private artifact only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/create_public_source.py
          zipfile=export/v1.0.0-public-source-preview.zip
          test -s "$zipfile"
          unzip -Z1 "$zipfile" | grep -Fxq LICENSE
          unzip -Z1 "$zipfile" | grep -Fxq app/src/main/assets/offline_boards.tsv
          unzip -Z1 "$zipfile" | grep -Fxq .github/workflows/public-ci.yml
          if unzip -Z1 "$zipfile" | grep -Eq '^docs/(PUBLIC_|RELEASE_CANDIDATE_|REAL_DEVICE_|GITHUB_PUBLIC_|SIGNING|UI_POLICY)'; then
            echo "::error::Private documentation unexpectedly selected."
            exit 1
          fi
          if unzip -Z1 "$zipfile" | grep -Eq '^.github/workflows/(release-candidate|public-security-audit|build-debug-apk|generate-5ch-snapshot)'; then
            echo "::error::Private workflow unexpectedly selected."
            exit 1
          fi
          sha256sum "$zipfile"
      - name: Save private source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-clean-source-preview
          path: export/
          if-no-files-found: error
          retention-days: 7

  service-connectivity-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe published endpoints without IDs or cookies
        run: python3 tools/live_service_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1.0.0-service-connectivity-evidence
          path: connectivity-report.json
          if-no-files-found: warn
          retention-days: 7
