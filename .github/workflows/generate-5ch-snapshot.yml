name: Generate independent offline board menu snapshot
on:
  push:
    branches: ['release-candidate/v1.0.0-rc1']
    paths:
      - '.github/workflows/generate-5ch-snapshot.yml'
      - 'tools/generate_5ch_snapshot.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise parser against independently created sample
        run: |
          python3 - <<'PY'
          import json, pathlib
          groups=[]
          for n in range(12):
              boards=[dict(url=f'https://egg.5ch.io/test{n}_{j}/',
                           directory_name=f'test{n}_{j}',
                           board_name=f'テスト板{n}_{j}') for j in range(10)]
              groups.append(dict(category_name=f'カテゴリ{n}',category_content=boards))
          pathlib.Path('sample.json').write_text(json.dumps({'menu_list':groups}), encoding='utf-8')
          PY
          python3 tools/generate_5ch_snapshot.py --input sample.json --output sample.tsv --metadata sample.meta.json
          test "$(wc -l < sample.tsv)" -eq 120
          python3 - <<'PY'
          import json
          m=json.load(open('sample.meta.json'))
          assert m['category_count'] == 12 and m['board_count'] == 120, m
          PY
      - name: Generate official offline board snapshot
        run: |
          set -euo pipefail
          python3 tools/generate_5ch_snapshot.py --output snapshot/offline_boards.tsv --metadata snapshot/offline_boards.meta.json
          test "$(wc -l < snapshot/offline_boards.tsv)" -ge 100
      - name: Save snapshot for review before committing
        uses: actions/upload-artifact@v4
        with:
          name: 5ch-board-menu-snapshot
          path: snapshot/
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated snapshot to private release candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::error::Branch advanced since workflow checkout, refusing to commit a potentially stale snapshot"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/contents/app/src/main/assets/offline_boards.tsv" --silent >/dev/null 2>&1; then
            echo "::error::Snapshot file already exists. Refusing overwrite without review."
            exit 1
          fi
          snapshot="$(base64 -w0 snapshot/offline_boards.tsv)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/app/src/main/assets/offline_boards.tsv" \
            -f message='data: bundle independently generated 5ch offline board snapshot' \
            -f branch="$GITHUB_REF_NAME" \
            -f content="$snapshot" > "$RUNNER_TEMP/snapshot-commit.json"
          echo "Generated snapshot committed on $GITHUB_REF_NAME."
