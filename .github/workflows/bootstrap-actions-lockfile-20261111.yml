name: Bootstrap Actions Lockfile (temporary)
on:
  push:
    branches: [security/actions-lockfiles-20261111]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install official actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock
      - name: Generate and verify lockfile for permanent workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Exclude this disposable workflow from the permanent lockfile.
          rm .github/workflows/bootstrap-actions-lockfile-20261111.yml
          gh actions-lock
          gh actions-lock --verify
          test -s .github/workflows/actions.lock
          tar czf "$RUNNER_TEMP/locked-workflows.tar.gz" .github/workflows
          echo "Generated and verified locked workflow dependencies."
      - name: Export generated files for review
        uses: actions/upload-artifact@v7
        with:
          name: generated-actions-lockfiles
          path: ${{ runner.temp }}/locked-workflows.tar.gz
          if-no-files-found: error
          retention-days: 1
