name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          problem-matcher: true
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.2'
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          # API 37.0 may install under android-37.0 while AGP expects android-37.
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify selected AGP buildscript dependency versions
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon buildEnvironment > "$RUNNER_TEMP/gradle-build-environment.txt"
          python3 tools/verify_gradle_buildscript_dependencies.py "$RUNNER_TEMP/gradle-build-environment.txt"
      - name: Unit tests, lint and debug build
        run: bash tools/gradle-retry.sh --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # Sign only the maintainer's own PR or the explicitly authorized v1.1.0 main release push.
      # The QA APK is non-debuggable and uses the release certificate for in-place upgrades.
      - name: Build signed QA APK
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'chikuwadon' && github.actor == 'chikuwadon') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chikuwadon/hissi-checker-droid-plus' && github.actor == 'chikuwadon' && startsWith(github.event.head_commit.message, 'Release v1.1.0')) }}
        env:
          HISSI_KEYSTORE_B64: ${{ secrets.HISSI_KEYSTORE_B64 }}
          HISSI_KEYSTORE_PASSWORD: ${{ secrets.HISSI_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HISSI_KEYSTORE_B64" || -z "$HISSI_KEYSTORE_PASSWORD" ]]; then
            echo "QA signing is unavailable: required secrets are not configured."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/hissi-qa-signing.p12"
          printf '%s' "$HISSI_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          HISSI_KEYSTORE_PATH="$KEYSTORE" HISSI_KEYSTORE_PASSWORD="$HISSI_KEYSTORE_PASSWORD" \
            bash tools/gradle-retry.sh --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
      - name: Give signed QA APK the versioned filename
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'chikuwadon' && github.actor == 'chikuwadon') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chikuwadon/hissi-checker-droid-plus' && github.actor == 'chikuwadon' && startsWith(github.event.head_commit.message, 'Release v1.1.0')) }}
        shell: bash
        run: |
          set -euo pipefail
          mv app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/HissiCheckerDroidPlus-v1.1.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/HissiCheckerDroidPlus-v1.1.0.apk
      - name: Verify official APK version and signing continuity
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chikuwadon/hissi-checker-droid-plus' && github.actor == 'chikuwadon' && startsWith(github.event.head_commit.message, 'Release v1.1.0') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/HissiCheckerDroidPlus-v1.1.0.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          BADGING="$("$TOOLS/aapt" dump badging "$APK")"
          grep -F "package: name='com.chikuwadon.hissidroidplus' versionCode='83' versionName='1.1.0'" <<< "$BADGING"
          if grep -q '^application-debuggable' <<< "$BADGING"; then
            echo "Release APK must not be debuggable."
            exit 1
          fi
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern 'HissiCheckerDroidPlus-v1.0.5.apk' --dir "$RUNNER_TEMP/prior-release"
          signer() {
            "$TOOLS/apksigner" verify --print-certs "$1" | grep -F 'Signer #1 certificate SHA-256 digest:'
          }
          current_signer="$(signer "$APK")"
          prior_signer="$(signer "$RUNNER_TEMP/prior-release/HissiCheckerDroidPlus-v1.0.5.apk")"
          test -n "$current_signer"
          test "$current_signer" = "$prior_signer"
          sha256sum "$APK"
      - name: Upload signed QA APK
        if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'chikuwadon' && github.actor == 'chikuwadon') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chikuwadon/hissi-checker-droid-plus' && github.actor == 'chikuwadon' && startsWith(github.event.head_commit.message, 'Release v1.1.0')) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hissi-checker-droid-plus-v1.1.0-signed
          path: app/build/outputs/apk/release/HissiCheckerDroidPlus-v1.1.0.apk
          if-no-files-found: error
          retention-days: 7

  publish-v1-1-0:
    name: Publish authorized v1.1.0 release
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chikuwadon/hissi-checker-droid-plus' && github.actor == 'chikuwadon' && startsWith(github.event.head_commit.message, 'Release v1.1.0') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-v1-1-0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Publish verified main APK and approved release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          grep -F "versionName = '1.1.0'" app/build.gradle
          grep -F "versionCode = 83" app/build.gradle
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.1.0 already exists; refusing to overwrite."
            exit 1
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name hissi-checker-droid-plus-v1.1.0-signed --dir "$RUNNER_TEMP/publish"
          APK="$RUNNER_TEMP/publish/HissiCheckerDroidPlus-v1.1.0.apk"
          test -s "$APK"
          gh release create v1.1.0 "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title v1.1.0 --notes-file docs/releases/v1.1.0.md --latest
          gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url
