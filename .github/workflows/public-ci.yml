name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          problem-matcher: true
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.1'
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          # API 37.0 may install under android-37.0 while AGP expects android-37.
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify selected AGP buildscript dependency versions
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon buildEnvironment > "$RUNNER_TEMP/gradle-build-environment.txt"
          python3 tools/verify_gradle_buildscript_dependencies.py "$RUNNER_TEMP/gradle-build-environment.txt"
      - name: Unit tests, lint and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # Sign only the maintainer's own PR, never forks or bot contributions.
      # The QA APK is non-debuggable and uses the release certificate for in-place upgrades.
      - name: Build signed QA APK
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'chikuwadon' && github.actor == 'chikuwadon' }}
        env:
          HISSI_KEYSTORE_B64: ${{ secrets.HISSI_KEYSTORE_B64 }}
          HISSI_KEYSTORE_PASSWORD: ${{ secrets.HISSI_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HISSI_KEYSTORE_B64" || -z "$HISSI_KEYSTORE_PASSWORD" ]]; then
            echo "QA signing is unavailable: required secrets are not configured."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/hissi-qa-signing.p12"
          printf '%s' "$HISSI_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          HISSI_KEYSTORE_PATH="$KEYSTORE" HISSI_KEYSTORE_PASSWORD="$HISSI_KEYSTORE_PASSWORD" \
            gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
      - name: Upload signed QA APK
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'chikuwadon' && github.actor == 'chikuwadon' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hissi-checker-droid-plus-v1.0.3-dev.1-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
