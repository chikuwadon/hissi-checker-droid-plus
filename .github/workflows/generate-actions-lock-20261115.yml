name: Generate current Actions lockfile (temporary)
on:
  push:
    branches: [maintenance/latest-actions-20261115]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GitHub official lockfile extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock
      - name: Generate and verify final dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/generate-actions-lock-20261115.yml
          gh actions-lock
          gh actions-lock --verify
          test -s .github/workflows/actions.lock
      - name: Upload verified lockfile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: actions-lock-latest-20261115
          path: .github/workflows/actions.lock
          retention-days: 1
          if-no-files-found: error
