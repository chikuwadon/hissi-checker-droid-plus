name: Inspect actual AGP buildscript classpath (temporary)
on:
  push:
    branches: [security/resolve-agp-classpath-20261115]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.1'
      - name: Diagnose selected root and app plugin classpaths
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon buildEnvironment :app:buildEnvironment > /tmp/plugin-build-environment.txt
          echo "Selected buildscript dependencies:"
          grep -E 'com.android.tools.build:gradle:|bcprov-jdk18on|bcpkix-jdk18on|guava:|kotlin-gradle-plugin:|commons-lang3:|httpclient:|jdom2:|jose4j:' /tmp/plugin-build-environment.txt | sort -u | head -100 || true
          echo "Full dependency report available as artifact"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: agp-build-environment-diagnostics
          path: /tmp/plugin-build-environment.txt
          retention-days: 1
