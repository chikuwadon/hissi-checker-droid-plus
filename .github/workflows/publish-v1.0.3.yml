name: Publish v1.0.3
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Only an explicitly authorized v1.0.3 release merge can publish.
    if: >-
      ${{ github.repository == 'chikuwadon/hissi-checker-droid-plus' &&
          startsWith(github.event.head_commit.message, 'release: v1.0.3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          problem-matcher: true
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.1'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify stable version, test, lint and build signed APK
        shell: bash
        env:
          HISSI_KEYSTORE_B64: ${{ secrets.HISSI_KEYSTORE_B64 }}
          HISSI_KEYSTORE_PASSWORD: ${{ secrets.HISSI_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Eq '^ *versionCode = 36 *$' app/build.gradle
          grep -Eq "^ *versionName = '1.0.3' *$" app/build.gradle
          test -f docs/RELEASE_NOTES_v1.0.3.md
          if [[ -z "$HISSI_KEYSTORE_B64" || -z "$HISSI_KEYSTORE_PASSWORD" ]]; then
            echo "Release signing secrets are unavailable" >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/hissi-release-signing.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$HISSI_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          HISSI_KEYSTORE_PATH="$KEYSTORE" HISSI_KEYSTORE_PASSWORD="$HISSI_KEYSTORE_PASSWORD" \
            gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mv "$APK" HissiCheckerDroidPlus-v1.0.3.apk
      - name: Verify signing identity against v1.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.0.2 --pattern 'HissiCheckerDroidPlus-v1.0.2.apk' --dir "$RUNNER_TEMP"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          previous=$("$SIGNER" verify --print-certs "$RUNNER_TEMP/HissiCheckerDroidPlus-v1.0.2.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          current=$("$SIGNER" verify --print-certs HissiCheckerDroidPlus-v1.0.3.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [[ -z "$previous" || -z "$current" || "$previous" != "$current" ]]; then
            echo "Release signing certificate does not match v1.0.2" >&2
            exit 1
          fi
          echo "Signing certificate matches the published v1.0.2 APK"
      - name: Create v1.0.3 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.3 >/dev/null 2>&1; then
            echo "Release v1.0.3 already exists; refusing to overwrite" >&2
            exit 1
          fi
          git fetch --tags
          if git rev-parse --verify refs/tags/v1.0.3 >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 v1.0.3)" != "$GITHUB_SHA" ]]; then
              echo "Tag v1.0.3 refers to another commit; refusing to move" >&2
              exit 1
            fi
          else
            git tag v1.0.3 "$GITHUB_SHA"
            git push origin refs/tags/v1.0.3
          fi
          gh release create v1.0.3 HissiCheckerDroidPlus-v1.0.3.apk \
            --verify-tag --title "v1.0.3" \
            --notes-file docs/RELEASE_NOTES_v1.0.3.md --latest
