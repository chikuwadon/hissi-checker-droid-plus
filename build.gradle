// Resolve Android Gradle Plugin and its build-only dependencies through
// a single root buildscript classpath so tested security constraints apply
// before the plugin is loaded. This is NOT an app/runtime dependency change.
buildscript {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  configurations.classpath {
    // Adjust the requested transitive version as well as the selected version.
    // This test distinguishes original POM metadata from the resolved classpath.
    resolutionStrategy.eachDependency { dep ->
      def patched = [
        'org.bouncycastle:bcprov-jdk18on': '1.86',
        'org.bouncycastle:bcpkix-jdk18on': '1.86',
        'org.bouncycastle:bcutil-jdk18on': '1.86',
        'com.google.guava:guava': '33.7.2-jre',
        'org.apache.commons:commons-lang3': '3.18.0',
        'org.apache.httpcomponents:httpclient': '4.5.14'
      ][dep.requested.group + ':' + dep.requested.name]
      if (patched != null) {
        dep.useVersion(patched)
      }
    }
    resolutionStrategy.force(
      'org.bouncycastle:bcprov-jdk18on:1.86',
      'org.bouncycastle:bcpkix-jdk18on:1.86',
      'org.bouncycastle:bcutil-jdk18on:1.86',
      'org.jdom:jdom2:2.0.6.1',
      'com.google.guava:guava:33.7.2-jre',
      'org.bitbucket.b_c:jose4j:0.9.6',
      'org.apache.commons:commons-lang3:3.18.0',
      'org.apache.httpcomponents:httpclient:4.5.14',
      // Kotlin build-cache deserialization CVE-2026-53914.
      // Experimental: validate KGP 2.4.21 with AGP 9.5.1 before adoption.
      'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    )
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:9.5.1'
  }
}
