// Keep AGP itself pinned to the latest stable version while investigating
// security advisories in its transitive *buildscript* dependencies.
// Do not force a newer Kotlin Gradle Plugin: AGP's built-in Kotlin integration
// must be updated by the Android tools vendor.
buildscript {
  configurations.classpath {
    resolutionStrategy.force(
      'org.bouncycastle:bcprov-jdk18on:1.86',
      'org.bouncycastle:bcpkix-jdk18on:1.86',
      'org.bouncycastle:bcutil-jdk18on:1.86',
      'org.jdom:jdom2:2.0.6.1',
      'com.google.guava:guava:33.7.2-jre',
      'org.bitbucket.b_c:jose4j:0.9.6',
      'org.apache.commons:commons-lang3:3.18.0',
      'org.apache.httpcomponents:httpclient:4.5.14'
    )
  }
}
plugins { id 'com.android.application' version '9.5.1' apply false }
