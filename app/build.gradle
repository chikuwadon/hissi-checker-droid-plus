plugins { id 'com.android.application' }
android {
  namespace = 'com.chikuwadon.hissidroidplus'
  // Compile against Android 17 (API 37); target 36 until behavior regression tests.
  compileSdk = 37
  defaultConfig {
    applicationId = 'com.chikuwadon.hissidroidplus'
    minSdk = 26
    targetSdk = 36
    versionCode = 36
    versionName = '1.0.3-dev.1'
  }
  // CI loads a persistent keystore from GitHub Actions Secrets, never from Git.
  signingConfigs {
    if (System.getenv('HISSI_KEYSTORE_PATH') && System.getenv('HISSI_KEYSTORE_PASSWORD')) {
      stableDebug {
        storeFile = file(System.getenv('HISSI_KEYSTORE_PATH'))
        storePassword = System.getenv('HISSI_KEYSTORE_PASSWORD')
        keyAlias = 'hissi-checker-droid'
        keyPassword = System.getenv('HISSI_KEYSTORE_PASSWORD')
        storeType = 'pkcs12'
      }
    }
  }
  buildTypes {
    debug {
      if (signingConfigs.findByName('stableDebug') != null) {
        signingConfig = signingConfigs.stableDebug
      }
    }
    release {
      // Never ship a debuggable APK. Require fixed signing via CI workflow.
      debuggable = false
      minifyEnabled = false
      if (signingConfigs.findByName('stableDebug') != null) {
        // Match the fixed certificate of currently installed QA APKs.
        signingConfig = signingConfigs.stableDebug
      }
    }
  }
  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
  testOptions { unitTests.returnDefaultValues = true }
  lint { lintConfig = file('lint.xml') }
}
dependencies {
  implementation 'org.jsoup:jsoup:1.24.1'
  testImplementation 'junit:junit:4.13.2'
}
