plugins { id 'com.android.application' }
android {
  namespace = 'com.chikuwadon.hissidroidplus'
  compileSdk = 36
  defaultConfig {
    applicationId = 'com.chikuwadon.hissidroidplus'
    minSdk = 26
    targetSdk = 36
    versionCode = 13
    versionName = '0.1.12'
  }
  // CI loads a persistent keystore from GitHub Actions Secrets, never from Git.
  signingConfigs {
    if (System.getenv('HISSI_KEYSTORE_PATH') && System.getenv('HISSI_KEYSTORE_PASSWORD')) {
      stableDebug {
        storeFile = file(System.getenv('HISSI_KEYSTORE_PATH'))
        storePassword = System.getenv('HISSI_KEYSTORE_PASSWORD')
        keyAlias = 'hissi-checker-droid'
        keyPassword = System.getenv('HISSI_KEYSTORE_PASSWORD')
        storeType = 'pkcs12'
      }
    }
  }
  buildTypes {
    debug {
      if (signingConfigs.findByName('stableDebug') != null) {
        signingConfig = signingConfigs.stableDebug
      }
    }
  }
  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
  testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
  implementation 'org.jsoup:jsoup:1.23.2'
  testImplementation 'junit:junit:4.13.2'
}
